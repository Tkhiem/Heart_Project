<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Heart WebGL</title>
<style>
html,body{
margin:0;
overflow:hidden;
background:#000;
width:100%;
height:100%;
}
canvas{display:block;}
</style>
</head>
<body>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
1000
);
camera.position.z = 120;

const renderer = new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);

// Stars
const starGeo = new THREE.BufferGeometry();
const starCount = 1200;
const starPos = new Float32Array(starCount*3);

for(let i=0;i<starCount;i++){
starPos[i*3]=(Math.random()-0.5)*800;
starPos[i*3+1]=(Math.random()-0.5)*800;
starPos[i*3+2]=(Math.random()-0.5)*800;
}

starGeo.setAttribute("position",
new THREE.BufferAttribute(starPos,3));

const starMat = new THREE.PointsMaterial({
size:1.2,
color:0xffffff
});

const stars = new THREE.Points(starGeo,starMat);
scene.add(stars);

// Heart particles
const heartGeo = new THREE.BufferGeometry();

const count = 12000;
const positions = new Float32Array(count*3);

for(let i=0;i<count;i++){

const t = Math.random()*Math.PI*2;

let x = 16*Math.pow(Math.sin(t),3);
let y = 13*Math.cos(t)
       -5*Math.cos(2*t)
       -2*Math.cos(3*t)
       -Math.cos(4*t);

const fill = Math.pow(Math.random(),0.28);

x *= fill*3.5;
y *= fill*3.5;

positions[i*3] = x;
positions[i*3+1] = y;
positions[i*3+2] = (Math.random()-0.5)*12;
}

heartGeo.setAttribute(
"position",
new THREE.BufferAttribute(positions,3)
);

const heartMat = new THREE.PointsMaterial({
color:0xff5ca4,
size:0.8,
transparent:true,
opacity:0.95
});

const heart = new THREE.Points(
heartGeo,
heartMat
);

scene.add(heart);
const smallHearts = [];

const smallHeartGeo = new THREE.BufferGeometry();
const smallHeartPos = [];

for(let i=0;i<150;i++){

    const angle = Math.random()*Math.PI*2;
    const radius = 50 + Math.random()*80;

    smallHeartPos.push(
        Math.cos(angle)*radius,
        (Math.random()-0.5)*80,
        Math.sin(angle)*radius
    );
}

smallHeartGeo.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        smallHeartPos,
        3
    )
);

const smallHeartMat = new THREE.PointsMaterial({
    color:0xff7ab8,
    size:2.2,
    transparent:true,
    opacity:0.9
});

const smallHeartCloud =
new THREE.Points(
    smallHeartGeo,
    smallHeartMat
);

scene.add(smallHeartCloud);

// glow sprite
const light = new THREE.PointLight(0xff5ca4,8,500);
light.position.set(0,0,40);
scene.add(light);

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});

function animate(time){
const pos =
smallHeartCloud.geometry.attributes.position;

for(let i=0;i<pos.count;i++){

    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);

    const angle =
    time*0.0002 + i*0.15;

    pos.setX(
        i,
        x + Math.sin(angle)*0.03
    );

    pos.setY(
        i,
        y + Math.cos(angle)*0.02
    );

    pos.setZ(
        i,
        z + Math.sin(angle*0.7)*0.03
    );
}

pos.needsUpdate = true;

requestAnimationFrame(animate);

const pulse =
1 +
Math.sin(time*0.004)*0.08 +
Math.sin(time*0.008)*0.03;

heart.scale.set(pulse,pulse,pulse);

//heart.rotation.y += 0.002;
//heart.rotation.x = Math.sin(time*0.0005)*0.15;

stars.rotation.y += 0.00015;

renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
